<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Cylinder 1 Gradient (Purple-Indigo) -->
    <linearGradient id="cylinderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <!-- Cylinder 2 Gradient (Deep Indigo-Violet) -->
    <linearGradient id="cylinderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle for app icon -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="128" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.2" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.4" filter="url(#glow)" />

  <g transform="translate(0, -10)">
    <!-- Bottom Cylinder Base Glow -->
    <ellipse cx="256" cy="380" rx="100" ry="30" fill="#4f46e5" fill-opacity="0.3" filter="url(#glow)" />

    <!-- Third/Bottom Cylinder -->
    <path d="M156,310 A100,30 0 0,0 356,310 L356,380 A100,30 0 0,1 156,380 Z" fill="url(#cylinderGrad2)" opacity="0.8" />
    <ellipse cx="256" cy="310" rx="100" ry="30" fill="url(#cylinderGrad1)" stroke="#e9d5ff" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Second/Middle Cylinder -->
    <path d="M156,220 A100,30 0 0,0 356,220 L356,290 A100,30 0 0,1 156,290 Z" fill="url(#cylinderGrad2)" />
    <ellipse cx="256" cy="220" rx="100" ry="30" fill="url(#cylinderGrad1)" stroke="#e9d5ff" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- First/Top Cylinder -->
    <path d="M156,130 A100,30 0 0,0 356,130 L356,200 A100,30 0 0,1 156,200 Z" fill="url(#cylinderGrad2)" />
    <ellipse cx="256" cy="130" rx="100" ry="30" fill="url(#cylinderGrad1)" stroke="#e9d5ff" stroke-width="2" />
    
    <!-- Top Cylinder Core Accent (Lumbung Logo Inner) -->
    <ellipse cx="256" cy="130" rx="50" ry="15" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,4" filter="url(#glow)" />
    <circle cx="256" cy="130" r="10" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Hexagonal Grid Details (High-Tech Feel) -->
  <path d="M 256 30 L 280 44 L 280 72 L 256 86 L 232 72 L 232 44 Z" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" transform="translate(0, 10)" />
  <path d="M 120 400 L 140 412 L 140 435 L 120 447 L 100 435 L 100 412 Z" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.2" />
  <path d="M 392 400 L 412 412 L 412 435 L 392 447 L 372 435 L 372 412 Z" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.2" />
</svg>
